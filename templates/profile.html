{% extends "base.html" %}

{% block content %}

<div class="profile-container">

    <div class="profile-header">
        <h1>{{ user.username }}</h1>
        <p>{{ user.email }}</p>
        <br>
        <h3>Total Stories: {{ posts|length }}</h3>
    </div>

    <h2>Your Published Stories</h2>

    <div class="posts-grid">

        {% for post in posts %}
        <div class="post-card">

            <h3>{{ post.title }}</h3>

            <p>{{ post.category }}</p>

            <a href="/post/{{ post.id }}">View</a>

        </div>
        {% endfor %}

    </div>

</div>

{% endblock %}
